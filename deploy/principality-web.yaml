apiVersion: apps/v1
kind: Deployment
metadata:
  name: principality-web
  namespace: availability
  labels:
    app: principality-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: principality-web
  template:
    metadata:
      labels:
        app: principality-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: principality-web
          image: ghcr.io/dehwyy/principality-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GIN_MODE
              value: release
            - name: SERVER_ADDR
              value: ":8080"
            - name: MINIO_BASE_URL
              value: https://api.lab.14dev.ru
          readinessProbe:
            httpGet:
              path: /principalities
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /principalities
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: principality-web
  namespace: availability
spec:
  selector:
    app: principality-web
  ports:
    - name: http
      port: 8080
      targetPort: http
