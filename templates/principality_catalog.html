<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{.Title}} — население Древней Руси по археологии</title>
    <link rel="stylesheet" href="/static/css/principalities.css">
</head>

<body>
    <main class="screen">
        <header class="screen__head">
            <h1 class="screen__title">{{.Title}}</h1>
            <form class="principalities-filter" method="get" action="/principalities">
                <label class="principalities-filter__caption" for="founded_before">Основано не позднее</label>
                <input class="principalities-filter__field" type="date" id="founded_before" name="foundedBefore"
                    value="{{.FoundedBefore}}">
                <button class="principalities-filter__submit" type="submit">Показать</button>
            </form>
        </header>

        {{if .Principalities}}
        <div class="principalities-grid">
            {{range .Principalities}}
            <a class="principality-card" href="/principalities/feed/{{.PrincipalityID}}">
                <span class="principality-card__media">
                    <img class="principality-card__poster" src="{{$.MinioBaseURL}}/principality-media/{{.ImageKey}}" alt="{{.PrincipalityName}}" loading="lazy">
                    <span class="like-counter">
                        <svg class="like-counter__glyph" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 21s-8-5.1-8-10.2A4.8 4.8 0 0 1 12 7.6 4.8 4.8 0 0 1 20 10.8C20 15.9 12 21 12 21z" />
                        </svg>
                        {{.LikeCount}}
                    </span>
                </span>
                <div class="principality-card__body">
                    <h2 class="principality-card__name">{{.PrincipalityName}}</h2>
                    <p class="principality-card__founding">{{.FoundingYear}}</p>
                    <div class="principality-card__footer">
                        <span class="land-coefficient-badge">коэф. земли {{.LandCoefficient}}</span>
                    </div>
                </div>
            </a>
            {{end}}
        </div>
        {{else}}
        <p class="principalities-empty">Княжеств, основанных не позднее {{.FoundedBefore}}, не нашлось.</p>
        {{end}}
    </main>
    {{template "tab_bar" .}}
</body>

</html>
