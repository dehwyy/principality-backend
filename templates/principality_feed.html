<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{.Title}} — население Древней Руси по археологии</title>
    <link rel="stylesheet" href="/static/css/principalities.css">
</head>

<body class="page page_feed">
    <main class="screen screen_feed">
        <video class="feed__video" src="{{.MinioBaseURL}}/principality-media/{{.Principality.VideoKey}}" poster="{{.MinioBaseURL}}/principality-media/{{.Principality.ImageKey}}" autoplay muted loop
            playsinline></video>
        <div class="feed__scrim"></div>

        <div class="feed__rail">
            <span class="feed__field">
                <span class="feed__field-value">{{.Principality.FoundingYear}}</span>
                <span class="feed__field-caption">основано</span>
            </span>
            <span class="feed__field">
                <span class="feed__field-value">{{.Principality.LandCoefficient}}</span>
                <span class="feed__field-caption">коэф. земли</span>
            </span>
            <span class="feed__action">
                <svg class="feed__action-glyph feed__action-glyph_like" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 21s-8-5.1-8-10.2A4.8 4.8 0 0 1 12 7.6 4.8 4.8 0 0 1 20 10.8C20 15.9 12 21 12 21z" />
                </svg>
                {{.Principality.LikeCount}}
            </span>
            <a class="feed__action" href="/principalities/feed/{{.Principality.PrincipalityID}}?next=true">
                <svg class="feed__action-glyph" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5.6 8.4 12 14.8l6.4-6.4 1.6 1.7-8 8-8-8z" />
                </svg>
                Далее
            </a>
        </div>

        <div class="feed__overlay">
            <h1 class="feed__name">{{.Principality.PrincipalityName}}</h1>
            <input class="feed__toggle" type="checkbox" id="principality-summary-toggle">
            <p class="feed__summary">{{.Principality.PrincipalitySummary}}</p>
            <label class="feed__toggle-label" for="principality-summary-toggle"></label>
        </div>
    </main>
    {{template "tab_bar" .}}
</body>

</html>
