services:
  db:
    image: postgres:16-alpine
    container_name: principality_db
    environment:
      POSTGRES_DB: principality
      POSTGRES_USER: principality
      POSTGRES_PASSWORD: principality
    ports:
      - "5433:5432"
    volumes:
      - principality_db_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: principality_adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: principality_redis
    ports:
      - "6379:6379"

  minio:
    container_name: minio_storage
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - principality_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  principality_db_data:
  principality_minio_data:
