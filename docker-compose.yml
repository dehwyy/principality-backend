services:
  db:
    image: postgres:16-alpine
    container_name: availability_db
    environment:
      POSTGRES_DB: availability
      POSTGRES_USER: availability
      POSTGRES_PASSWORD: availability
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: availability_adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: availability_redis
    ports:
      - "6379:6379"

  minio:
    container_name: minio_storage
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  db_data:
  minio-data:
